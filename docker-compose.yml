services:
  # Postgres local — profil optionnel (désactivé quand on utilise Aiven)
  # docker compose --profile localdb up -d db
  db:
    profiles: ["localdb"]
    image: postgres:16-alpine
    container_name: electio_db
    environment:
      POSTGRES_DB: ${DB_NAME:-electio}
      POSTGRES_USER: ${DB_USER:-electio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-electio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-electio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: electio_backend
    env_file: .env
    # Pas de depends_on db : avec Aiven on lance seulement backend + frontend
    # docker compose up --build backend frontend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: electio_frontend
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8050:8050"

  # BI self-service (compétence C7) — profil optionnel
  # docker compose --profile bi up -d metabase
  # Puis http://localhost:3000 — connecter Postgres (Aiven ou profil localdb)
  metabase:
    profiles: ["bi"]
    image: metabase/metabase:v0.51.2
    container_name: electio_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - backend

  # Datalake objet (strategie Big Data) — profil optionnel
  # docker compose --profile datalake up -d minio
  minio:
    profiles: ["datalake"]
    image: minio/minio:latest
    container_name: electio_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-electio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-electioelectio}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
  metabase_data:
